version: '3'

tasks:

  default:
    internal: true
    desc: Default
    cmds:
      - |
        echo "Working dir: {{.USER_WORKING_DIR}}"
        echo "OS: {{OS}}"
        task --list
    silent: true

  assert:
    cmds:
      - for:
          var: REQUIRED_TOOLS
          split: ','
          as: TOOL
        cmd: |
          [ -n "$(which {{ .TOOL }})" ] || ( \
            echo "ERROR: `{{ .TOOL }}` not found" && exit 1; \
          )
    silent: true
    internal: true
    vars:
      REQUIRED_TOOLS: git, python3, uv

  clone:
    deps: [assert]
    desc: Setup repositories
    vars:
      CMD: ./bin/gitctl
    cmds:
      - "uv run {{.CMD}} clone -f ./repositories.yaml -r ~/depository"

  update:
    deps: [assert]
    desc: Update depository (no archived or templates)
    vars:
      CMD: ./bin/gitctl
    cmds:
      - "uv run {{.CMD}} update --depository --ignore archived,templates"

  tokyonight:
    deps: [assert]
    desc: Update colorscheme (documentation)
    vars:
      CMD: .bin/tint16cli
      COLORSCHEME: "{{.HOME}}/.config/tint16/schemas/tokyonight-moon.json"
    cmds:
      - "uv run {{.CMD}} {{.COLORSCHEME}}"

  tokyonight-day:
    deps: [assert]
    desc: Update colorscheme (documentation)
    vars:
      CMD: .bin/tint16cli
      COLORSCHEME: "{{.HOME}}/.config/tint16/schemas/tokyonight-day.json"
    cmds:
      - "uv run {{.CMD}} {{.COLORSCHEME}}"
