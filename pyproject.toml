[project]
name = "dotfiles"
version = "8.3.9"
description = "Personal development laboratory"
authors = [{ name = "Itzalak", email = "itzalak@tuta.io" }]
readme = "README.md"
keywords = ["dotfiles", "archlinux", "hyprland", "macos"]
requires-python = ">=3.13"
dependencies = [
  "pytest >= 8.3.3",
  "pyyaml >= 6.0.2",
  "python-dotenv >= 1.0.1",
  "toml >= 0.10.2",
  "click>=8.3.1",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.commitizen]
name = "cz_customize"
tag_format = "v$major.$minor.$patch"
version_scheme = "semver"
version = "8.0.10"
update_changelog_on_bump = true
version_provider = "uv"

[tool.uv]
required-version = ">=0.7.3"

[tool.commitizen.customize]
schema = "<type>[(scope)]: <message>"
schema_pattern = "^(feat|fix|docs|test|chore|revert)(\\([^()\\r\\n]+\\))?(!)?:\\s.*"
bump_pattern = "^(feat|fix|chore)"
bump_map = { "feat" = "MINOR", "fix" = "PATCH", "chore" = "PATCH" }
commit_parser = "^(?P<change_type>feat|fix|docs|test|chore|revert)(?:\\((?P<scope>[^()\\r\\n]*)\\))?(?P<breaking>!)?:\\s(?P<message>.*)?"
changelog_pattern = "^(feat|fix|chore|docs)"
change_type_map = { "feat" = "Features", "fix" = "Bug Fixes", "chore" = "Chores", "docs" = "Documentation" }
change_type_order = ["Features", "Bug Fixes", "Chores", "Documentation"]
